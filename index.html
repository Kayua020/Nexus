function planDay(){const t=today();const now=new Date();let cur=Math.max(8*60,Math.ceil((now.getHours()*60+now.getMinutes())/30)*30);const endDay=22*60;
  const busy=eventsOn(t).filter(e=>e.time).map(e=>[toMin(e.time),toMin(e.end)||toMin(e.time)+60,e]);
  const tasks=S.tasks.filter(x=>x.status!=='done'&&(!x.due||x.due<=addDays(t,3))).sort((a,b)=>{const s=x=>(x.due&&x.due<t?0:x.due===t?1:2)*3+PRI_ORD[x.priority];return s(a)-s(b)}).slice(0,6);
  const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');const plan=[];
  const freeAt=(s,d)=>{for(const [a,b] of busy)if(s<b&&a<s+d)return b;return null};
  busy.forEach(([a,b,e])=>{if(b>cur)plan.push({s:a,txt:`📅 <b>${esc(e.title)}</b> (${fmt(a)}–${fmt(b)})`})});
  tasks.forEach(x=>{const d=x.priority==='alta'?90:x.priority==='media'?60:30;let g=0;while(g++<40&&cur+d<=endDay){const nb=freeAt(cur,d);if(nb==null)break;cur=nb}if(cur+d<=endDay){plan.push({s:cur,txt:`✅ ${esc(x.title)} <span class="dim">(${d} min${x.due&&x.due<t?', atrasada':''})</span>`});cur+=d+15}});
  S.habits.filter(h=>!h.log[t]&&h.reminder).forEach(h=>{const m=toMin(h.reminder);if(m>=now.getHours()*60)plan.push({s:m,txt:`${h.icon} ${esc(h.name)} <span class="dim">(hábito)</span>`})});
  plan.sort((a,b)=>a.s-b.s);if(!plan.length)return {html:'Seu dia está livre e sem pendências urgentes. Que tal adiantar algo de um objetivo? 🎯'};
  const late=tasks.filter(x=>x.due&&x.due<t).length;
  return {html:`Montei uma sugestão de cronograma para hoje, encaixando suas tarefas prioritárias nos horários livres da agenda:${li(plan.map(p=>`<b class="mono">${fmt(p.s)}</b> — ${p.txt}`))}${late?`⚠️ Coloquei primeiro as ${late} tarefa(s) atrasada(s). `:''}Fiz pausas de 15 min entre blocos. Ajuste conforme sua energia ao longo do dia.`}}
function weekSummary(){const t=today(),s=addDays(t,-6);const inR=d=>d&&d>=s&&d<=t;const done=S.tasks.filter(x=>x.status==='done'&&inR(x.doneAt));let evc=0,habc=0;for(let i=0;i<7;i++){const d=addDays(t,-i);evc+=eventsOn(d).length;S.habits.forEach(h=>{if(h.log[d])habc++})}
  const inc=sum(S.tx.filter(x=>x.type==='income'&&inR(x.date)),x=>x.amount);const exps=[];for(let i=0;i<7;i++){const d=addDays(t,-i);exps.push(...expensesIn(ym(d)).filter(x=>x.date===d))}const exp=sum(exps,x=>x.amount);
  const nextEv=[];for(let i=1;i<=7;i++){const d=addDays(t,i);eventsOn(d).filter(e=>e.recur==='none').forEach(e=>nextEv.push(`${fdate(d,{rel:true})}: ${esc(e.title)}`))}
  const best=[...S.habits].sort((a,b)=>{const c=h=>Array.from({length:7},(_,i)=>h.log[addDays(t,-i)]?1:0).reduce((x,y)=>x+y,0);return c(b)-c(a)})[0];
  return {html:`📊 <b>Resumo da semana</b> (${fdate(s)} – ${fdate(t)})${li([`✅ <b>${done.length}</b> tarefa(s) concluída(s)${done.length?': '+done.slice(0,3).map(x=>esc(x.title)).join(', ')+(done.length>3?'…':''):''}`,`📅 <b>${evc}</b> compromisso(s) na agenda`,`🔥 <b>${habc}</b> registros de hábitos (${Math.round(habc/(S.habits.length*7||1)*100)}% de cumprimento)${best?' — destaque: '+best.icon+' '+esc(best.name):''}`,`💰 Entradas: <b class="green">${money(inc)}</b> · Saídas: <b>${money(exp)}</b>${exps.length?' · maior categoria: '+byCat(exps)[0][0]:''}`,`⚠️ <b>${overdueTasks().length}</b> tarefa(s) atrasada(s)`])}${nextEv.length?'<b>Próxima semana:</b>'+li(nextEv.slice(0,5)):''}`}}
function finAnalysis(){const t=today(),k=ym(t);const inc=incomeIn(k),exp=expenseTotal(k);const prev=[1,2,3].map(i=>ymAdd(k,-i));const avgC={};prev.forEach(m=>byCat(expensesIn(m)).forEach(([c,v])=>avgC[c]=(avgC[c]||0)+v/3));
  const cur=byCat(expensesIn(k));const dayFrac=D(t).getDate()/new Date(+k.slice(0,4),+k.slice(5),0).getDate();const ins=[];
  const curItems=expensesIn(k);cur.forEach(([c,v])=>{const fx=sum(curItems.filter(x=>x.cat===c&&x.fixed),x=>x.amount);const proj=fx+(v-fx)/dayFrac;if(avgC[c]&&proj>avgC[c]*1.2&&v>50)ins.push(`📈 <b>${c}</b> está acima do normal: projeção de ${money(proj)} no mês vs. média de ${money(avgC[c])}.`)});
  const cats=Object.fromEntries(cur);S.budgets.forEach(b=>{const u=cats[b.cat]||0;if(u>b.limit)ins.push(`🚨 Orçamento de <b>${b.cat}</b> estourado: ${money(u)} de ${money(b.limit)}.`);else if(u>b.limit*.8)ins.push(`⚠️ <b>${b.cat}</b> já usou ${Math.round(u/b.limit*100)}% do orçamento.`)});
  const del=expensesIn(k).filter(x=>/delivery|ifood|restaurante/i.test(x.desc));if(del.length>=2)ins.push(`🍔 ${del.length} gastos com delivery/restaurante este mês (${money(sum(del,x=>x.amount))}). Cozinhar mais 1x por semana pode economizar ~${money(sum(del,x=>x.amount)/del.length*4*.5)}/mês.`);
  const subs=sum(expensesIn(k).filter(x=>x.cat==='Assinaturas'),x=>x.amount);if(subs)ins.push(`📺 Você gasta ${money(subs)}/mês em assinaturas (${money(subs*12)}/ano). Vale revisar as que usa pouco.`);
  const rate=inc?Math.round((inc-exp)/inc*100):0;const fg=S.fgoals.filter(g=>g.saved<g.target).map(g=>({g,per:(g.target-g.saved)/Math.max(1,Math.ceil(diffDays(t,g.deadline)/30))}));const need=sum(fg,x=>x.per);
  return {html:`💡 <b>Análise financeira de ${MESF[+k.slice(5)-1].toLowerCase()}</b><br>Receitas: <b class="green">${money(inc)}</b> · Despesas: <b>${money(exp)}</b> · Taxa de poupança: <b class="${rate>=20?'green':rate>=0?'yellow':'red'}">${rate}%</b> ${rate>=20?'(ótima! acima dos 20% recomendados)':rate>=10?'(razoável — o ideal é 20%+)':'(baixa — atenção aos gastos)'}<br><br><b>O que encontrei:</b>${li(ins.length?ins:['✅ Nenhum padrão preocupante encontrado. Seus gastos estão dentro da média.'])}
   <b>Metas financeiras:</b> para cumprir todas no prazo, você precisa guardar cerca de <b>${money(need)}/mês</b>${inc-exp>0?` — seu resultado atual (${money(inc-exp)}) ${inc-exp>=need?'<span class="green">cobre isso</span>':'<span class="yellow">ainda não cobre</span>'}`:''}.<br><br><b>Sugestões:</b>${li(['Separe o valor das metas logo após receber (pague-se primeiro).',cur[0]?`Defina um teto para <b>${cur[0][0]}</b>, sua maior categoria.`:'Registre seus gastos diariamente.','Mantenha uma reserva de emergência de 6 meses de despesas ('+money(exp*6)+').'])}`}}

  switch(a.kind){case 'task':S.tasks.push({id:uid(),title:d.title,desc:'Criada pelo NEXUS AI',due:d.due,priority:d.priority,cat:d.cat,status:'todo',projectId:'',goalId:'',eventId:'',recur:'none',created:today()});html=`✅ Tarefa <b>${esc(d.title)}</b> criada para ${fdate(d.due,{rel:true}).toLowerCase()}. <a data-act="nav" data-view="tarefas">Ver tarefas →</a>`;break;
   case 'expense':S.tx.push({id:uid(),type:'expense',amount:d.amount,desc:d.desc,cat:d.cat,date:d.date,accountId:d.accountId,paid:true,fixed:false,recurring:false});html=`✅ Despesa de <b>${money(d.amount)}</b> registrada em ${d.cat}. O Dashboard e os relatórios já foram atualizados. <a data-act="nav" data-view="fortuna">Abrir FORTUNA →</a>`;break;

   case 'income':S.tx.push({id:uid(),type:'income',amount:d.amount,desc:d.desc,cat:d.cat,date:d.date,accountId:d.accountId,paid:true,fixed:false,recurring:false});html=`✅ Receita de <b>${money(d.amount)}</b> registrada.`;break;
   case 'fgoal':S.fgoals.push({id:uid(),name:d.name,target:d.target,saved:0,deadline:d.deadline,icon:'🎯'});html=`✅ Meta <b>${esc(d.name)}</b> criada. Para chegar lá até ${fdate(d.deadline,{y:1})}, guarde ~${money(d.target/Math.max(1,Math.ceil(diffDays(today(),d.deadline)/30)))}/mês. <a data-act="goFTab" data-tab="metas">Ver metas →</a>`;break;
   case 'goal':S.goals.push({id:uid(),title:d.title,cat:'Pessoal',horizon:'medio',deadline:d.deadline,desc:'',metric:{unit:'',current:0,target:0},steps:d.steps.map(t=>({id:uid(),t,done:false})),done:false});html=`✅ Objetivo <b>${esc(d.title)}</b> criado com ${d.steps.length} etapas. <a data-act="nav" data-view="objetivos">Ver objetivos →</a>`;break;
   case 'habit':S.habits.push({id:uid(),name:d.name,icon:'✨',color:PAL[S.habits.length%PAL.length],freq:'daily',target:7,goalId:'',reminder:'',log:{}});html=`✅ Hábito <b>${esc(d.name)}</b> criado. Bora começar a sequência! 🔥`;break;
   case 'note':{const nn=newNote({title:d.title,body:d.body,folder:d.folder,tags:d.tags});html=`✅ Anotação salva em <b>${esc(d.folder)}</b>. <a data-act="openNote" data-id="${nn.id}" data-go="1">Abrir e editar →</a>`;break}
   case 'event':S.events.push({id:uid(),title:d.title,date:d.date,time:d.time,end:d.end,cat:d.cat,recur:'none',reminder:30,desc:''});html=`✅ <b>${esc(d.title)}</b> adicionado à agenda em ${fdate(d.date,{rel:true}).toLowerCase()}${d.time?' às '+d.time:''}. Você receberá um lembrete 30 min antes.`;break;
   case 'steps':{const g=S.goals.find(x=>x.id===d.goalId);if(g)d.steps.forEach(t=>g.steps.push({id:uid(),t,done:false}));html=`✅ ${d.steps.length} etapas adicionadas ao objetivo.`;break}
   case 'reschedule':d.ids.forEach(id=>{const x=S.tasks.find(t=>t.id===id);if(x)x.due=today()});html=`✅ ${d.ids.length} tarefa(s) reagendada(s) para hoje.`;break}
  m.action.status='done';S.chat.push({id:uid(),role:'ai',html});save();render()}

const byId=(arr,id)=>arr.find(x=>x.id===id);
function accountForm(a){const isNew=!a;a=a||{name:'',type:'Conta corrente',bank:'',initial:0,color:PAL[S.accounts.length%PAL.length]};
  openModal(isNew?'Nova conta':'Editar conta',`${fld('Nome',inp('name',a.name,'text','required placeholder="Ex.: Nubank"'))}<div class="frow">${fld('Tipo',`<select name="type">${opt(['Conta corrente','Conta digital','Poupança','Dinheiro','Carteira digital','Conta investimento'],a.type)}</select>`)}${fld('Instituição',inp('bank',a.bank,'text','placeholder="Banco / instituição"'))}</div><div class="frow">${fld('Saldo inicial',inp('initial',a.initial,'number','step="0.01"'))}${fld('Cor',inp('color',a.color,'color','style="height:42px;padding:4px"'))}</div>`,
  {onSave:fd=>{const o={name:fd.name,type:fd.type,bank:fd.bank||fd.name,initial:+fd.initial||0,color:fd.color};if(isNew){S.accounts.push(Object.assign({id:uid()},o));toast('Conta criada')}else{Object.assign(a,o);toast('Conta atualizada')}},
   danger:isNew||S.accounts.length<2?null:{fn:()=>{S.accounts=S.accounts.filter(x=>x.id!==a.id);S.tx=S.tx.filter(t=>t.accountId!==a.id&&t.toAccountId!==a.id);toast('Conta excluída','trash')}}})}
function transferForm(x){openModal('Transferência entre contas',`<div class="frow">${fld('De',`<select name="from">${opt(S.accounts.map(a=>[a.id,a.name+' ('+money(accBalance(a.id))+')']),x?x.accountId:'')}</select>`)}${fld('Para',`<select name="to">${opt(S.accounts.map(a=>[a.id,a.name]),x?x.toAccountId:(S.accounts[1]||{}).id)}</select>`)}</div><div class="frow">${fld('Valor',inp('amount',x?x.amount:'','number','required step="0.01" min="0.01"'))}${fld('Data',inp('date',x?x.date:today(),'date'))}</div>${fld('Descrição',inp('desc',x?x.desc:'Transferência'))}`,
  {onSave:fd=>{if(fd.from===fd.to){toast('Escolha contas diferentes','alert');return false}const o={type:'transfer',accountId:fd.from,toAccountId:fd.to,amount:+fd.amount,date:fd.date,desc:fd.desc,paid:true};if(x)Object.assign(x,o);else S.tx.push(Object.assign({id:uid()},o));toast('Transferência registrada')},danger:x?{fn:()=>{S.tx=S.tx.filter(t=>t.id!==x.id)}}:null})}
function cardForm(c){const isNew=!c;c=c||{name:'',brand:'Mastercard',limit:5000,closeDay:1,dueDay:8,color:'linear-gradient(135deg,#7c3aed,#4c1d95)',accountId:S.accounts[0].id,last:''};
  const grads=[['linear-gradient(135deg,#7c3aed,#4c1d95)','Roxo'],['linear-gradient(135deg,#27272a,#09090b)','Black'],['linear-gradient(135deg,#0ea5e9,#1e3a8a)','Azul'],['linear-gradient(135deg,#f97316,#9a3412)','Laranja'],['linear-gradient(135deg,#10b981,#065f46)','Verde'],['linear-gradient(135deg,#ec4899,#831843)','Rosa']];
  openModal(isNew?'Novo cartão':'Editar cartão',`<div class="frow">${fld('Nome',inp('name',c.name,'text','required placeholder="Ex.: Nubank"'))}${fld('Bandeira',`<select name="brand">${opt(['Mastercard','Visa','Elo','American Express','Hipercard'],c.brand)}</select>`)}</div>
   <div class="frow3">${fld('Limite total',inp('limit',c.limit,'number','required step="0.01"'))}${fld('Dia de fechamento',inp('closeDay',c.closeDay,'number','min="1" max="31" required'))}${fld('Dia de vencimento',inp('dueDay',c.dueDay,'number','min="1" max="31" required'))}</div>
   <div class="frow3">${fld('Últimos 4 dígitos',inp('last',c.last,'text','maxlength="4"'))}${fld('Conta de pagamento',`<select name="accountId">${opt(S.accounts.map(a=>[a.id,a.name]),c.accountId)}</select>`)}${fld('Estilo',`<select name="color">${opt(grads,c.color)}</select>`)}</div>`,
  {onSave:fd=>{const o={name:fd.name,brand:fd.brand,limit:+fd.limit,closeDay:clamp(+fd.closeDay,1,31),dueDay:clamp(+fd.dueDay,1,31),last:fd.last,accountId:fd.accountId,color:fd.color};if(isNew){const nc=Object.assign({id:uid()},o);S.cards.push(nc);U.cardSel=nc.id;toast('Cartão adicionado')}else{Object.assign(c,o);toast('Cartão atualizado')}},
   danger:isNew?null:{fn:()=>{S.cards=S.cards.filter(x=>x.id!==c.id);S.cardPurchases=S.cardPurchases.filter(p=>p.cardId!==c.id);U.cardSel=null;toast('Cartão excluído','trash')}}})}
function purchaseForm(cardId){openModal('Registrar compra no cartão',`${fld('Cartão',`<select name="cardId">${opt(S.cards.map(c=>[c.id,c.name+' · disponível '+money(c.limit-cardUsed(c.id))]),cardId)}</select>`)}${fld('Descrição',inp('desc','','text','required placeholder="Ex.: Tênis"'))}
  <div class="frow3">${fld('Valor total',inp('amount','','number','required step="0.01" min="0.01"'))}${fld('Parcelas',`<select name="installments">${opt(Array.from({length:12},(_,i)=>[i+1,i===0?'À vista':(i+1)+'x']),1)}</select>`)}${fld('Data',inp('date',today(),'date'))}</div>${fld('Categoria',`<select name="cat">${opt(S.categories.expense,'Compras')}</select>`)}`,
  {onSave:fd=>{const c=byId(S.cards,fd.cardId);const v=+fd.amount;if(v>c.limit-cardUsed(c.id)+0.01){toast('Limite insuficiente neste cartão','alert');return false}S.cardPurchases.push({id:uid(),cardId:fd.cardId,desc:fd.desc,amount:v,installments:+fd.installments,date:fd.date,cat:fd.cat});toast(+fd.installments>1?`Compra registrada em ${fd.installments}x de ${money(v/fd.installments)}`:'Compra registrada')}})}
function payInvoice(cardId,k){const c=byId(S.cards,cardId);const due=invoiceTotal(cardId,k)-invoicePaid(cardId,k);
  openModal('Pagar fatura · '+esc(c.name),`<p class="muted small" style="margin-bottom:14px">Fatura de ${MESF[+k.slice(5)-1]} · vencimento ${fdate(invoiceDue(c,k),{y:1})}</p><div class="frow">${fld('Valor',inp('amount',due.toFixed(2),'number','step="0.01" min="0.01" required'))}${fld('Pagar com',`<select name="accountId">${opt(S.accounts.map(a=>[a.id,a.name+' ('+money(accBalance(a.id))+')']),c.accountId)}</select>`)}</div>`,
  {saveText:'Confirmar pagamento',onSave:fd=>{const tx={id:uid(),type:'cardpay',amount:+fd.amount,desc:'Pagamento fatura '+c.name,date:today(),accountId:fd.accountId,cardId,paid:true};S.tx.push(tx);S.cardPayments.push({id:uid(),cardId,invoice:k,amount:+fd.amount,date:today(),txId:tx.id});toast('Fatura paga')}})}
function budgetForm(b){const isNew=!b;b=b||{cat:S.categories.expense.find(c=>!S.budgets.some(x=>x.cat===c))||'Outros',limit:300};
  openModal(isNew?'Novo orçamento':'Editar orçamento',`<div class="frow">${fld('Categoria',`<select name="cat">${opt(S.categories.expense,b.cat)}</select>`)}${fld('Limite mensal',inp('limit',b.limit,'number','required step="0.01" min="1"'))}</div><p class="tiny dim">O sistema acompanha os gastos automaticamente (incluindo compras no cartão).</p>`,
  {onSave:fd=>{if(isNew&&S.budgets.some(x=>x.cat===fd.cat)){toast('Já existe orçamento para esta categoria','alert');return false}if(isNew){S.budgets.push({id:uid(),cat:fd.cat,limit:+fd.limit});toast('Orçamento criado')}else{b.cat=fd.cat;b.limit=+fd.limit;toast('Orçamento atualizado')}},danger:isNew?null:{fn:()=>{S.budgets=S.budgets.filter(x=>x.id!==b.id)}}})}
function invForm(i){const isNew=!i;i=i||{name:'',type:'Renda fixa',applied:'',current:'',rate:''};
  openModal(isNew?'Novo investimento':'Editar investimento',`${fld('Nome do ativo',inp('name',i.name,'text','required placeholder="Ex.: Tesouro IPCA+ 2035"'))}<div class="frow">${fld('Tipo',`<select name="type">${opt(['Renda fixa','Tesouro Direto','Ações','ETF','FII','Cripto','Previdência','Outros'],i.type)}</select>`)}${fld('Rentabilidade informada',inp('rate',i.rate,'text','placeholder="Ex.: 12% a.a."'))}</div><div class="frow">${fld('Valor aplicado',inp('applied',i.applied,'number','required step="0.01"'))}${fld('Valor atual',inp('current',i.current,'number','required step="0.01"'))}</div>`,
  {onSave:fd=>{const o={name:fd.name,type:fd.type,rate:fd.rate,applied:+fd.applied,current:+fd.current};if(isNew){S.investments.push(Object.assign({id:uid(),moves:[{date:today(),type:'aporte',amount:+fd.applied}]},o));toast('Investimento cadastrado')}else{Object.assign(i,o);toast('Investimento atualizado')}},danger:isNew?null:{fn:()=>{S.investments=S.investments.filter(x=>x.id!==i.id)}}})}
function invMoveForm(i){openModal('Aporte ou resgate · '+esc(i.name),`<div class="chip-row" style="margin-bottom:14px"><label class="chip pick"><input type="radio" name="type" value="aporte" checked hidden>Aporte</label><label class="chip pick"><input type="radio" name="type" value="resgate" hidden>Resgate</label></div><div class="frow">${fld('Valor',inp('amount','','number','required step="0.01" min="0.01"'))}${fld('Data',inp('date',today(),'date'))}</div>
  <div class="tiny dim" style="margin-bottom:8px">Histórico</div>${i.moves.slice().reverse().map(m=>`<div class="row small" style="margin:4px 0"><span class="${m.type==='aporte'?'green':'red'}">${m.type}</span><span class="dim">${fdate(m.date,{y:1})}</span><span class="spacer"></span><b class="mono">${money(m.amount)}</b></div>`).join('')}`,

 aiQuick:(f,fd)=>aiAsk(fd.q),aiSend:(f,fd)=>{aiAsk(fd.q);},
 quickTask:(f,fd)=>{if(!fd.t.trim())return;const {due,title}=parseQuickDate(fd.t);S.tasks.push({id:uid(),title:title||fd.t,desc:'',due:due||'',priority:/urgente|!/.test(fd.t)?'alta':'media',cat:S.taskCats[0],status:'todo',projectId:'',goalId:'',eventId:'',recur:'none',created:today()});save();render();toast('Tarefa adicionada'+(due?' para '+fdate(due,{rel:true}).toLowerCase():''));setTimeout(()=>{const i=$('[data-form=quickTask] input');i&&i.focus()},30)},
 addStep:(f,fd)=>{if(!fd.s.trim())return;byId(S.goals,f.dataset.id).steps.push({id:uid(),t:fd.s.trim(),done:false});save();render()},
 addMs:(f,fd)=>{const p=byId(S.projects,U.projSel);if(fd.end<fd.start){toast('Fim antes do início','alert');return}p.milestones.push({id:uid(),t:fd.t,start:fd.start,end:fd.end,done:false});p.milestones.sort((a,b)=>a.start.localeCompare(b.start));save();render()},
 addUpdate:(f,fd)=>{const p=byId(S.projects,U.projSel);p.updates.unshift({at:Date.now(),text:fd.t});save();render();toast('Atualização publicada')},
 addRef:(f,fd)=>{const p=byId(S.projects,U.projSel);let url=fd.url.trim();if(!/^https?:\/\//.test(url))url='https://'+url;p.refs.push({t:fd.t,url});save();render()},
 profile:(f,fd)=>{const u=user();u.name=fd.name.trim()||u.name;u.phone=fd.phone;u.bio=fd.bio;save();render();toast('Perfil atualizado')},
 password:(f,fd)=>{const u=user();const e=$('#pwErr');if(u.pass!==hashPass(fd.cur)){e.textContent='Senha atual incorreta.';return}if(fd.nw!==fd.nw2){e.textContent='As senhas não coincidem.';return}u.pass=hashPass(fd.nw);save();f.reset();e.textContent='';toast('Senha alterada com segurança','lock')},
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.tagName==='A'||a.dataset.act==='nav')e.preventDefault();const fn=ACT[a.dataset.act];if(fn){if(a.closest('#modal')&&!['closeModal','dashMove','txTypeSwitch','copyEl','restoreVer','toggleTask'].includes(a.dataset.act)&&a.type!=='submit')closeModal();fn(a.dataset,a,e)}});
document.addEventListener('dblclick',e=>{const a=e.target.closest('[data-dbl]');if(!a)return;if(a.dataset.dbl==='newEventOn')openEvent(null,{date:a.dataset.date});if(a.dataset.dbl==='1'){U.notePreview=false;const n=curNote();n&&(U._snap={id:n.id,body:n.body});render()}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CHANGE[el.dataset.change])CHANGE[el.dataset.change](el)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='gsearch'){const r=searchAll(el.value);const box=$('#gres');box.classList.toggle('hidden',!el.value.trim());box.innerHTML=r.length?r.map((x,i)=>`<div class="it" data-sr="${i}">${ic(x.i,16)}<span>${esc(x.t)}</span><small>${esc(x.s)}</small></div>`).join(''):'<div class="dim small" style="padding:12px">Nada encontrado.</div>';searchAll._r=r;return}
  if(el.dataset.input&&INPUT[el.dataset.input]){const k=el.dataset.input;const pos=el.selectionStart;INPUT[k](el);if(['txF','noteQ'].includes(k))setTimeout(()=>{const n=$(`[data-input="${k}"]`);if(n&&document.activeElement!==n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},k==='txF'?260:210)}});
document.addEventListener('mousedown',e=>{const it=e.target.closest('[data-sr]');if(it){e.preventDefault();const r=searchAll._r[+it.dataset.sr];$('#gsearch').value='';$('#gres').classList.add('hidden');r.a()}});
document.addEventListener('focusout',e=>{if(e.target.id==='gsearch')setTimeout(()=>{const b=$('#gres');b&&b.classList.add('hidden')},150);if(e.target.dataset&&e.target.dataset.input==='noteBody'){snapshotNote(curNote());save()}});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='authForm'){e.preventDefault();authSubmit(f);return}if(f.dataset.form&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f,Object.fromEntries(new FormData(f)))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();const b=$('#gres');b&&b.classList.add('hidden')}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#gsearch')){e.preventDefault();$('#gsearch').focus()}
  if(e.key==='Enter'&&e.target.id==='gsearch'&&searchAll._r&&searchAll._r[0]){const r=searchAll._r[0];e.target.value='';$('#gres').classList.add('hidden');r.a()}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.session&&VIEWS.some(v=>v[0]===h)&&h!==U.view)go(h)});

/* ---------- init ---------- */
(function init(){S=load();if(!S||!S.v||!S.users){S=seed()}
  // garante estruturas novas
  const base=seed();['notifRead','notifDismissed','notifLog','chat','cardPayments','folders','taskCats','goalCats'].forEach(k=>{if(S[k]==null)S[k]=base[k]});S.settings=Object.assign(base.settings,S.settings);
  materializeRecurring();const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))U.view=h;save();render()})();

</script></body></html>
