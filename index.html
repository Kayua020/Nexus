<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS — Seu sistema operacional pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#07060c;--bg2:#0e0c17;--panel:rgba(255,255,255,.035);--panel2:rgba(255,255,255,.065);--panel3:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.075);--border2:rgba(255,255,255,.14);
  --text:#eeedf5;--muted:#a19eb5;--dim:#6d6a83;
  --acc:#8b5cf6;--acc2:#a78bfa;--acc3:#c4b5fd;--accbg:rgba(139,92,246,.14);--glow:rgba(139,92,246,.38);
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;--cyan:#22d3ee;--pink:#f472b6;--blue:#60a5fa;--orange:#fb923c;
  --shadow:0 10px 40px -12px rgba(0,0,0,.6);
  --r:16px;--sb:252px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--head:'Space Grotesk','Inter',sans-serif;
}
body.light{
  --bg:#f5f4fa;--bg2:#ecebf4;--panel:rgba(255,255,255,.85);--panel2:rgba(20,10,50,.045);--panel3:rgba(20,10,50,.08);
  --border:rgba(30,20,70,.09);--border2:rgba(30,20,70,.18);
  --text:#17142a;--muted:#5d5974;--dim:#8f8ba6;--accbg:rgba(139,92,246,.1);--glow:rgba(139,92,246,.22);
  --shadow:0 10px 30px -14px rgba(40,20,90,.25);
}
body.acc-indigo{--acc:#6366f1;--acc2:#818cf8;--acc3:#a5b4fc;--accbg:rgba(99,102,241,.14);--glow:rgba(99,102,241,.38)}
body.acc-fuchsia{--acc:#d946ef;--acc2:#e879f9;--acc3:#f0abfc;--accbg:rgba(217,70,239,.14);--glow:rgba(217,70,239,.36)}
body.acc-cyan{--acc:#06b6d4;--acc2:#22d3ee;--acc3:#67e8f9;--accbg:rgba(6,182,212,.14);--glow:rgba(6,182,212,.34)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -10%,var(--glow),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(34,211,238,.07),transparent 60%),radial-gradient(800px 600px at 60% 120%,rgba(217,70,239,.08),transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:56px 56px;
  mask-image:radial-gradient(ellipse at 30% 0%,#000 0%,transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc2);text-decoration:none}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:-.01em}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ---------- AUTH ---------- */
.auth{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.auth-hero{padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;border-right:1px solid var(--border);position:relative;overflow:hidden}
.auth-hero h1{font-size:clamp(34px,4.2vw,58px);line-height:1.04;margin:28px 0 18px;max-width:640px}
.auth-hero h1 span{background:linear-gradient(100deg,var(--acc3),var(--acc) 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-hero p.lead{color:var(--muted);font-size:16px;max-width:520px}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:36px;max-width:600px}
.mod-chip{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--panel);display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);animation:fadeUp .6s both}
.mod-chip svg{color:var(--acc2);flex:none}
.mod-chip b{color:var(--text);font-weight:600;display:block;font-size:12px;letter-spacing:.04em}
.orb{position:absolute;width:520px;height:520px;border-radius:50%;right:-220px;bottom:-200px;background:radial-gradient(circle at 35% 35%,var(--acc2),var(--acc) 40%,transparent 70%);filter:blur(40px);opacity:.35;animation:float 12s ease-in-out infinite}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px}
.auth-card{width:100%;max-width:400px;padding:36px;border-radius:22px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(20px);box-shadow:var(--shadow);animation:fadeUp .5s both}
.auth-card h2{font-size:24px;margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin-bottom:24px}
.demo-hint{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--accbg);border:1px dashed var(--acc);font-size:12.5px;color:var(--muted)}
.demo-hint b{color:var(--text)}
.auth-switch{margin-top:16px;text-align:center;color:var(--muted);font-size:13px}
.auth-switch button{background:none;border:none;color:var(--acc2);cursor:pointer;font-weight:600}

/* ---------- LOGO ---------- */
.logo{display:flex;align-items:center;gap:11px;font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.18em}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc2),var(--acc) 55%,#4c1d95);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 8px 24px -6px var(--glow)}
.logo small{display:block;font-family:var(--font);font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:500;margin-top:-2px}

/* ---------- APP LAYOUT ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;border-right:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);backdrop-filter:blur(18px);z-index:30}
body.light .sidebar{background:rgba(255,255,255,.6)}
.sidebar .logo{padding:4px 10px 22px}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.nav-label{font-size:10.5px;letter-spacing:.14em;color:var(--dim);padding:14px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:13.5px;transition:.18s;position:relative}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:var(--accbg);color:var(--text)}
.nav a.active::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.nav a.active svg{color:var(--acc2)}
.nav a .tag{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:20px;background:var(--acc);color:#fff;font-weight:700}
.nav a .tag.soft{background:var(--panel3);color:var(--muted)}
.side-user{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);margin-top:12px;cursor:pointer}
.side-user .nm{font-weight:600;font-size:13px;line-height:1.2}.side-user .em{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.avatar{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;background-size:cover;background-position:center}
.avatar.lg{width:84px;height:84px;border-radius:22px;font-size:28px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px)}
.topbar h1{font-size:18px;white-space:nowrap}
.topbar .crumb{color:var(--dim);font-size:12px;white-space:nowrap}
.search{position:relative;flex:1;max-width:440px;margin-left:auto}
.search input{width:100%;padding:9px 14px 9px 36px;border-radius:11px;border:1px solid var(--border);background:var(--panel);outline:none;transition:.2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--dim);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-family:var(--font)}
.search-res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:380px;overflow:auto;z-index:50}
.search-res .it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}
.search-res .it:hover{background:var(--panel2)}
.search-res .it small{color:var(--dim);margin-left:auto;font-size:11px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--panel);display:grid;place-items:center;cursor:pointer;position:relative;transition:.18s;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--bg)}
.menu-btn{display:none}
.content{padding:26px 28px 60px;max-width:1500px;width:100%;margin:0 auto}
.view{animation:fadeUp .38s both}

/* ---------- COMPONENTS ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px);position:relative;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--border2)}
.card.glow{background:linear-gradient(140deg,var(--accbg),var(--panel) 60%);border-color:color-mix(in srgb,var(--acc) 30%,var(--border))}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px}
.card-h .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accbg);color:var(--acc2);flex:none}
.card-h .more{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:repeat(12,minmax(0,1fr))}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span9{grid-column:span 9}.span12{grid-column:span 12}
.stagger>*{animation:fadeUp .45s both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(7){animation-delay:.24s}.stagger>*:nth-child(8){animation-delay:.28s}.stagger>*:nth-child(n+9){animation-delay:.3s}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;font-weight:600;font-size:13px;transition:.18s;white-space:nowrap;color:var(--text)}
.btn:hover{border-color:var(--border2);background:var(--panel3)}
.btn.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px var(--glow)}
.btn.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:7px;gap:4px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{background:var(--panel2);color:var(--text)}
.btn.danger{color:var(--red)}.btn.danger:hover{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3)}
.btn.full{width:100%;justify-content:center}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.tiny{font-size:11px}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.acc{color:var(--acc2)}
.mono{font-variant-numeric:tabular-nums}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:26px;line-height:1.1}
.page-head p{color:var(--muted);margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--acc2);font-weight:700;text-transform:uppercase}
.tabs{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--panel);border:1px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:9px;border:none;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;display:flex;gap:7px;align-items:center;transition:.18s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--panel3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--border)}
.seg button{padding:5px 11px;border:none;background:none;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.seg button.on{background:var(--panel3);color:var(--text)}
.stat .lbl{color:var(--muted);font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
.stat .val{font-family:var(--head);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.stat .delta{font-size:12px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.pill.alta{background:rgba(248,113,113,.12);color:#fca5a5;border-color:rgba(248,113,113,.25)}
.pill.media{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.25)}
.pill.baixa{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.25)}
body.light .pill.alta{color:#dc2626}body.light .pill.media{color:#b45309}body.light .pill.baixa{color:#059669}
.pill.accp{background:var(--accbg);color:var(--acc3);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
body.light .pill.accp{color:var(--acc)}
.pill.late{background:rgba(248,113,113,.15);color:var(--red);border-color:rgba(248,113,113,.3)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.bar{height:8px;border-radius:8px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:5px}
.bar.warn>i{background:linear-gradient(90deg,#f59e0b,var(--yellow))}.bar.over>i{background:linear-gradient(90deg,#ef4444,var(--red))}.bar.ok>i{background:linear-gradient(90deg,#10b981,var(--green))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.li .t{font-weight:500}
.li .s{font-size:12px;color:var(--dim)}
.li .r{margin-left:auto;text-align:right;flex:none}
.li.click{cursor:pointer;border-radius:10px;padding-left:8px;padding-right:8px}.li.click:hover{background:var(--panel2)}
.check{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--border2);display:grid;place-items:center;cursor:pointer;flex:none;transition:.18s;background:transparent}
.check:hover{border-color:var(--acc)}
.check.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 12px -2px var(--glow)}
.check.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-t{text-decoration:line-through;color:var(--dim)}
.empty{text-align:center;padding:28px 12px;color:var(--dim);font-size:13px}
.empty svg{opacity:.5;margin-bottom:6px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:.15s}
.chip:hover{color:var(--text)}.chip.on{background:var(--accbg);color:var(--text);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:10px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:var(--panel)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.ring{position:relative;display:grid;place-items:center}
.ring span{position:absolute;font-family:var(--head);font-weight:600}
.kpi-mini{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--border)}
.kpi-mini b{font-family:var(--head);font-size:18px}
.kpi-mini span{font-size:11.5px;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp,.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--panel2);outline:none;transition:.18s}
.field textarea{min-height:90px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
select option{background:var(--bg2);color:var(--text)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.toggle{position:relative;width:40px;height:23px;flex:none;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle i{position:absolute;inset:0;border-radius:20px;background:var(--panel3);transition:.2s;border:1px solid var(--border)}
.toggle i::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;left:2px;top:2px;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle input:checked+i{background:var(--acc)}
.toggle input:checked+i::after{transform:translateX(17px)}
.cbx{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.cbx input{accent-color:var(--acc);width:16px;height:16px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(5,3,12,.62);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;animation:fade .2s}
.modal{width:100%;max-width:540px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:17px}
.modal-b{padding:20px 22px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border)}
.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--border2);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:slideIn .3s both;font-weight:500;max-width:360px}
.toast svg{color:var(--green);flex:none}

/* dashboard */
.hello h2{font-size:30px}
.hello h2 span{background:linear-gradient(100deg,var(--acc3),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.fin-big{font-family:var(--head);font-size:34px;font-weight:600;letter-spacing:-.02em}
.mini-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mini-legend span{display:flex;align-items:center;gap:6px}
.habit-dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;transition:.2s;flex:none}
.habit-dot.on{background:var(--accbg);border-color:var(--acc);box-shadow:0 0 18px -6px var(--glow)}
.ai-quick{display:flex;gap:8px;margin-top:12px}
.ai-quick input{flex:1}

/* fortuna */
.acc-card{padding:18px;border-radius:16px;border:1px solid var(--border);background:var(--panel);position:relative;overflow:hidden}
.acc-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--c,var(--acc));opacity:.13;filter:blur(8px)}
.ccard{border-radius:18px;padding:20px;min-height:170px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);cursor:pointer;transition:transform .25s}
.ccard:hover{transform:translateY(-3px) rotate(-.4deg)}
.ccard::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 100% 0%,rgba(255,255,255,.25),transparent 60%)}
.ccard .chipi{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#fde68a,#d97706);opacity:.9}
.ccard .num{letter-spacing:.2em;font-family:var(--head);opacity:.9}
.ccard.sel{outline:2px solid var(--acc2);outline-offset:3px}
.cat-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}

/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.cal .dh{background:var(--bg2);padding:9px;text-align:center;font-size:11px;letter-spacing:.08em;color:var(--dim);font-weight:600;text-transform:uppercase}
.cal .dc{background:color-mix(in srgb,var(--bg) 85%,transparent);min-height:108px;padding:7px;cursor:pointer;transition:.15s;overflow:hidden}
.cal .dc:hover{background:var(--panel2)}
.cal .dc.out{opacity:.38}
.cal .dc .n{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:8px;margin-bottom:3px}
.cal .dc.today .n{background:var(--acc);color:#fff;box-shadow:0 0 14px -2px var(--glow)}
.cal .dc.sel{background:var(--accbg)}
.ev{font-size:11px;padding:2px 6px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);cursor:pointer}
.ev.task{border-left-style:dashed}
.week{display:grid;grid-template-columns:54px repeat(7,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--border);gap:1px}
.week .wh{background:var(--bg2);padding:8px;text-align:center;font-size:12px;font-weight:600}
.week .wh.today{color:var(--acc2)}
.week .hr{background:var(--bg2);font-size:10.5px;color:var(--dim);padding:3px 6px;text-align:right;height:48px}
.week .slot{background:color-mix(in srgb,var(--bg) 88%,transparent);height:48px;position:relative;cursor:pointer}
.week .slot:hover{background:var(--panel2)}
.week .wev{position:absolute;left:3px;right:3px;top:3px;z-index:2;font-size:11px;padding:3px 6px;border-radius:7px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--bg2));overflow:hidden;cursor:pointer}
.day-tl .slot2{display:flex;gap:12px;border-bottom:1px dashed var(--border);min-height:52px;padding:6px 0}
.day-tl .slot2 .h{width:52px;color:var(--dim);font-size:12px;flex:none}
.day-tl .ev{font-size:12.5px;padding:7px 10px;white-space:normal}

/* tasks kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;min-height:300px;transition:.2s}
.kcol.over{border-color:var(--acc);background:var(--accbg)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-weight:600}
.kcol-h .count{margin-left:auto;font-size:11px;color:var(--dim);background:var(--panel2);padding:1px 8px;border-radius:10px}
.kcard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:9px;cursor:grab;transition:.18s}
body.light .kcard{background:#fff}
.kcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:600;margin-bottom:6px}
.kcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:13px;background:var(--panel);margin-bottom:8px;transition:.18s}
.task-row:hover{border-color:var(--border2)}
.task-row.late{border-color:rgba(248,113,113,.35);background:linear-gradient(90deg,rgba(248,113,113,.07),var(--panel) 40%)}
.task-row .body{flex:1;min-width:0;cursor:pointer}
.task-row .t{font-weight:600}
.task-row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}

/* goals */
.goal-card .top{display:flex;gap:12px;align-items:flex-start}
.steps .st{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.trophy{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(90deg,rgba(251,191,36,.1),transparent);border:1px solid rgba(251,191,36,.2);margin-bottom:8px}

/* habits */
.hab-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.week7{display:flex;gap:5px}
.week7 .d{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:600;border:1px solid var(--border);background:var(--panel2);cursor:pointer;color:var(--dim);transition:.15s}
.week7 .d.on{background:var(--hc,var(--acc));border-color:transparent;color:#fff;box-shadow:0 4px 14px -6px var(--hc,var(--glow))}
.week7 .d.today{outline:1.5px solid var(--acc2);outline-offset:1px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--panel3)}
.heat i.on{background:var(--hc,var(--acc))}
.streak{font-family:var(--head);font-weight:700;font-size:22px;display:flex;align-items:center;gap:4px}

/* knowledge */
.kn{display:grid;grid-template-columns:210px 300px 1fr;gap:16px;min-height:calc(100vh - 200px)}
.kn-side .f{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.kn-side .f:hover{background:var(--panel2);color:var(--text)}
.kn-side .f.on{background:var(--accbg);color:var(--text)}
.kn-side .f small{margin-left:auto;font-size:11px;color:var(--dim)}
.note-it{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:.15s}
.note-it:hover{background:var(--panel2)}
.note-it.on{background:var(--panel2);border-color:var(--border2)}
.note-it .t{font-weight:600;display:flex;gap:6px;align-items:center}
.note-it .p{font-size:12px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.editor-title{width:100%;font-family:var(--head);font-size:26px;font-weight:600;background:none;border:none;outline:none;padding:4px 0}
.editor-area{width:100%;min-height:380px;background:none;border:none;outline:none;resize:vertical;font-size:14.5px;line-height:1.75;font-family:var(--font)}
.md h1{font-size:24px;margin:14px 0 8px}.md h2{font-size:19px;margin:14px 0 6px}.md h3{font-size:16px;margin:12px 0 6px}
.md p{margin:8px 0;line-height:1.75}.md ul{margin:8px 0 8px 20px}.md li{margin:3px 0}
.md code{background:var(--panel3);padding:1px 6px;border-radius:5px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.md pre{background:var(--panel2);padding:12px;border-radius:10px;overflow:auto;margin:10px 0;border:1px solid var(--border)}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--acc);padding:4px 12px;color:var(--muted);margin:10px 0}
.md .wl{background:var(--accbg);color:var(--acc3);padding:1px 7px;border-radius:6px;cursor:pointer;font-weight:500}
body.light .md .wl{color:var(--acc)}
.md .wl.missing{opacity:.5;text-decoration:line-through}

/* projects */
.proj-card{cursor:pointer;overflow:hidden}
.proj-card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.gantt{position:relative}
.gantt .gr{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border)}
.gantt .track{position:relative;height:22px;background:var(--panel);border-radius:7px}
.gantt .gb{position:absolute;top:3px;bottom:3px;border-radius:5px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));opacity:.85}
.gantt .gb.done{opacity:.4}
.gantt .now{position:absolute;top:0;bottom:0;width:2px;background:var(--pink);z-index:3;box-shadow:0 0 8px var(--pink)}
.timeline .tl{display:flex;gap:12px;padding-bottom:14px;position:relative}
.timeline .tl::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:1px;background:var(--border2)}
.timeline .tl:last-child::before{display:none}
.timeline .tl .pt{width:11px;height:11px;border-radius:50%;background:var(--acc);margin-top:5px;flex:none;box-shadow:0 0 0 4px var(--accbg)}

/* AI */
.ai-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px;height:calc(100vh - 170px);min-height:520px}
.chat{display:flex;flex-direction:column;padding:0;overflow:hidden}
.chat-log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:11px;max-width:86%;animation:fadeUp .3s both}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{padding:12px 15px;border-radius:15px;background:var(--panel2);border:1px solid var(--border);line-height:1.6}
.msg.me .bub{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-color:transparent;border-bottom-right-radius:5px}
.msg.ai .bub{border-bottom-left-radius:5px}
.msg .bub ul{margin:6px 0 4px 18px}.msg .bub li{margin:2px 0}
.msg .bub b{color:var(--text)}.msg.me .bub b{color:#fff}
.ai-av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:conic-gradient(from 180deg,var(--acc),var(--pink),var(--cyan),var(--acc));color:#fff;animation:spinGlow 8s linear infinite}
.action-card{margin-top:10px;padding:12px;border-radius:12px;border:1px dashed var(--acc);background:var(--accbg)}
.action-card .k{font-size:11px;letter-spacing:.1em;color:var(--acc3);font-weight:700;text-transform:uppercase}
body.light .action-card .k{color:var(--acc)}
.chat-in{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);background:var(--panel)}
.chat-in input{flex:1;padding:12px 16px;border-radius:13px;border:1px solid var(--border);background:var(--panel2);outline:none}
.chat-in input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:12.5px;color:var(--muted);transition:.15s}
.sugg button:hover{border-color:var(--acc);color:var(--text);background:var(--accbg)}
.typing{display:flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--acc2);animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* notifications */
.notif{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:13px;border:1px solid var(--border);background:var(--panel);margin-bottom:8px;transition:.2s}
.notif.unread{border-color:color-mix(in srgb,var(--acc) 40%,var(--border));background:linear-gradient(90deg,var(--accbg),var(--panel) 50%)}
.notif .ni{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.notif .tt{font-weight:600}
.notif .when{font-size:11.5px;color:var(--dim)}

/* about */
.road{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.road .v{padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--panel);position:relative}
.road .v.cur{border-color:var(--acc);background:var(--accbg)}
.road .v b{font-family:var(--head);font-size:13px;color:var(--acc2)}

/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-30px)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes spinGlow{to{filter:hue-rotate(360deg)}}
@keyframes grow{from{stroke-dashoffset:var(--len)}}
.draw{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.chart-bar{transform-origin:bottom;animation:barUp .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes barUp{from{transform:scaleY(0)}}
.chart-tip{position:fixed;pointer-events:none;z-index:300;background:var(--bg2);border:1px solid var(--border2);padding:7px 10px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap}

/* responsive */
@media (max-width:1200px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span3{grid-column:span 6}.span4{grid-column:span 6}.span5,.span7,.span9,.agside{grid-column:span 12}.span8{grid-column:span 12}
  .kn{grid-template-columns:180px 250px 1fr}
  .ai-wrap{grid-template-columns:1fr}.ai-side{display:none}
  .road{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .3s;background:var(--bg2)}
  .sidebar.open{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.5)}
  .menu-btn{display:grid}
  .auth{grid-template-columns:1fr}.auth-hero{padding:36px 28px;border-right:none;border-bottom:1px solid var(--border)}
  .mod-grid{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
  .span3,.span4,.span6{grid-column:span 12}
  .kn{grid-template-columns:1fr}
  .topbar{padding:12px 16px}.content{padding:18px 16px 60px}
  .topbar .crumb{display:none}
  .search kbd{display:none}
  .frow3{grid-template-columns:1fr 1fr}
  .cal .dc{min-height:70px}.cal .ev{display:none}.cal .dc .dots{display:flex}
  .hab-card{grid-template-columns:auto 1fr}.hab-card .heatwrap{display:none}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr 1fr}
  .search{display:none}
  .frow{grid-template-columns:1fr}
  .page-head h2{font-size:22px}
  .week{font-size:10px}
  .msg{max-width:95%}
  .road{grid-template-columns:1fr}
}
.dots{display:none;gap:3px;flex-wrap:wrap}.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}

.chip.pick{cursor:pointer;font-size:15px}.chip.pick:has(input:checked){background:var(--accbg);color:var(--text);border-color:var(--acc)}

.kn .search{flex:none}
.grid>*{min-width:0}
@media (max-width:560px){.stat .val{font-size:20px}.fin-big{font-size:26px}.card{padding:16px}.content{overflow-x:hidden}.hello h2{font-size:24px}}

/* ---------- regras financeiras ---------- */
function materializeRecurring(){
  const t=today(),limit=ymAdd(ym(t),1);let ch=false;
  S.tx.filter(x=>x.recurring&&!x.parentId).forEach(src=>{
    let k=ymAdd(ym(src.date),1);const day=+src.date.slice(8);
    while(k<=limit){const [y,m]=k.split('-').map(Number);const last=new Date(y,m,0).getDate();const date=k+'-'+String(Math.min(day,last)).padStart(2,'0');
      if(!S.tx.some(x=>(x.parentId===src.id||x.id===src.id)&&ym(x.date)===k)&&!S.tx.some(x=>x._seedRec&&x.desc===src.desc&&ym(x.date)===k&&x.id!==src.id)){
        S.tx.push(Object.assign({},src,{id:uid(),date,parentId:src.id,recurring:false,paid:date<=t&&src.type==='income'?true:date<t,_seedRec:false}));ch=true}
      k=ymAdd(k,1)}
  });
  // pagamentos de fatura do seed
  S.tx.filter(x=>x._seedPay).forEach(x=>{const k=x._inv;x.amount=+invoiceTotal(x.cardId,k).toFixed(2);delete x._seedPay;if(x.amount>0)S.cardPayments.push({id:uid(),cardId:x.cardId,invoice:k,amount:x.amount,date:x.date,txId:x.id});ch=true});
  S.tx=S.tx.filter(x=>!(x.type==='cardpay'&&!(x.amount>0)));
  if(ch)save();
}
function invoiceKeyForPay(cardId,payDate){const c=S.cards.find(c=>c.id===cardId);let k=ym(payDate);if(c&&c.dueDay<c.closeDay)k=ymAdd(k,-1);return ymAdd(k,0)}
// fatura identificada pelo mês do fechamento
function firstInvoice(card,date){const day=+date.slice(8);let k=ym(date);if(day>card.closeDay)k=ymAdd(k,1);return k}
function installmentsOf(p){const c=S.cards.find(c=>c.id===p.cardId);if(!c)return[];const k0=firstInvoice(c,p.date);const n=p.installments||1;return Array.from({length:n},(_,i)=>({inv:ymAdd(k0,i),amount:p.amount/n,n:i+1,of:n,p}))}
function invoiceItems(cardId,k){return S.cardPurchases.filter(p=>p.cardId===cardId).flatMap(installmentsOf).filter(x=>x.inv===k)}
function invoiceTotal(cardId,k){return sum(invoiceItems(cardId,k),x=>x.amount)}
function invoicePaid(cardId,k){return sum(S.cardPayments.filter(p=>p.cardId===cardId&&p.invoice===k),p=>p.amount)}
function invoiceDue(card,k){let due=k;if(card.dueDay<card.closeDay)due=ymAdd(k,1);const [y,m]=due.split('-').map(Number);const last=new Date(y,m,0).getDate();return due+'-'+String(Math.min(card.dueDay,last)).padStart(2,'0')}
function invoiceClose(card,k){const [y,m]=k.split('-').map(Number);const last=new Date(y,m,0).getDate();return k+'-'+String(Math.min(card.closeDay,last)).padStart(2,'0')}
function currentInvoice(card){return firstInvoice(card,today())}
function cardUsed(cardId){const all=S.cardPurchases.filter(p=>p.cardId===cardId).flatMap(installmentsOf);const keys=[...new Set(all.map(x=>x.inv))];return sum(keys,k=>Math.max(0,invoiceTotal(cardId,k)-invoicePaid(cardId,k)))}
function accBalance(id){let b=+(S.accounts.find(a=>a.id===id)||{}).initial||0;
  S.tx.forEach(x=>{if(!x.paid)return;if(x.type==='income'&&x.accountId===id)b+=x.amount;if((x.type==='expense'||x.type==='cardpay')&&x.accountId===id)b-=x.amount;if(x.type==='transfer'){if(x.accountId===id)b-=x.amount;if(x.toAccountId===id)b+=x.amount}});return b}
const totalBalance=()=>sum(S.accounts,a=>accBalance(a.id));
// despesas por mês (transações + parcelas de cartão no mês da fatura)
function expensesIn(k,{cards=true}={}){const a=S.tx.filter(x=>x.type==='expense'&&ym(x.date)===k).map(x=>({cat:x.cat,amount:x.amount,desc:x.desc,date:x.date,fixed:!!x.fixed}));
  if(cards)S.cardPurchases.flatMap(installmentsOf).filter(i=>i.inv===k).forEach(i=>a.push({cat:i.p.cat,amount:i.amount,desc:i.p.desc+(i.of>1?` (${i.n}/${i.of})`:''),date:i.p.date,card:true,fixed:i.of>1}));return a}
const incomeIn=k=>sum(S.tx.filter(x=>x.type==='income'&&ym(x.date)===k),x=>x.amount);
const expenseTotal=k=>sum(expensesIn(k),x=>x.amount);
function byCat(items){const m={};items.forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const investTotal=()=>sum(S.investments,i=>i.current);
const patrimony=()=>totalBalance()+investTotal()-sum(S.cards,c=>cardUsed(c.id));
function upcomingBills(days=30){const t=today(),lim=addDays(t,days);const out=[];
  S.tx.filter(x=>x.type==='expense'&&!x.paid&&x.date<=lim).forEach(x=>out.push({kind:'tx',id:x.id,desc:x.desc,amount:x.amount,date:x.date,cat:x.cat,late:x.date<t}));
  S.cards.forEach(c=>{[ymAdd(currentInvoice(c),-1),currentInvoice(c)].forEach(k=>{const tot=invoiceTotal(c.id,k)-invoicePaid(c.id,k);const due=invoiceDue(c,k);if(tot>0.5&&due<=lim)out.push({kind:'inv',id:c.id+':'+k,cardId:c.id,inv:k,desc:'Fatura '+c.name,amount:tot,date:due,cat:'Cartão',late:due<t})})});
  return out.sort((a,b)=>a.date.localeCompare(b.date))}

/* ---------- agenda ---------- */
function eventOccurs(e,date){if(date<e.date)return false;if(e.until&&date>e.until)return false;if(date===e.date)return true;const d=D(date),o=D(e.date);
  switch(e.recur){case 'daily':return true;case 'weekday':return d.getDay()>0&&d.getDay()<6;case 'weekly':return d.getDay()===o.getDay();case 'monthly':return d.getDate()===o.getDate();case 'yearly':return d.getDate()===o.getDate()&&d.getMonth()===o.getMonth();default:return false}}
function eventsOn(date){return S.events.filter(e=>eventOccurs(e,date)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
const tasksDue=date=>S.tasks.filter(t=>t.due===date&&t.status!=='done');
const overdueTasks=()=>S.tasks.filter(t=>t.status!=='done'&&t.due&&t.due<today());
function toMin(h){if(!h)return null;const [a,b]=h.split(':').map(Number);return a*60+(b||0)}
function conflicts(days=14){const out=[];for(let i=0;i<days;i++){const d=addDays(today(),i);const ev=eventsOn(d).filter(e=>e.time&&e.end);for(let a=0;a<ev.length;a++)for(let b=a+1;b<ev.length;b++){if(toMin(ev[a].time)<toMin(ev[b].end)&&toMin(ev[b].time)<toMin(ev[a].end))out.push({date:d,a:ev[a],b:ev[b]})}}return out}

/* ---------- hábitos / objetivos / projetos ---------- */
function streak(h){let n=0;let d=today();if(!h.log[d])d=addDays(d,-1);while(h.log[d]){n++;d=addDays(d,-1)}return n}
function bestStreak(h){const ds=Object.keys(h.log).sort();let best=0,cur=0,prev=null;ds.forEach(d=>{cur=prev&&diffDays(prev,d)===1?cur+1:1;best=Math.max(best,cur);prev=d});return best}
function consistency(h,days=30){let c=0;for(let i=0;i<days;i++)if(h.log[addDays(today(),-i)])c++;const exp=h.freq==='weekly'?days/7*h.target:days;return clamp(Math.round(c/exp*100),0,100)}
function weekCount(h){const d=D(today());const start=addDays(today(),-((d.getDay()+6)%7));let c=0;for(let i=0;i<7;i++)if(h.log[addDays(start,i)])c++;return c}
function goalProgress(g){if(g.done)return 100;if(g.metric&&+g.metric.target>0)return clamp(Math.round(g.metric.current/g.metric.target*100),0,100);if(g.steps&&g.steps.length)return Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100);return 0}
function projTasks(id){return S.tasks.filter(t=>t.projectId===id)}
function projProgress(p){if(p.status==='concluido')return 100;const ts=projTasks(p.id);const ms=p.milestones||[];const a=ts.length?ts.filter(t=>t.status==='done').length/ts.length:null;const b=ms.length?ms.filter(m=>m.done).length/ms.length:null;if(a==null&&b==null)return 0;if(a==null)return Math.round(b*100);if(b==null)return Math.round(a*100);return Math.round((a*.6+b*.4)*100)}

function buildNotifs(){const t=today(),n=S.settings.notif,out=[];const P=(o)=>out.push(o);
  if(n.contas)upcomingBills(7).filter(b=>b.kind==='tx').forEach(b=>P({id:'bill-'+b.id,type:'contas',icon:'coin',color:'#fbbf24',title:b.late?'Conta atrasada: '+b.desc:'Conta a vencer: '+b.desc,text:money(b.amount)+' · vence '+fdate(b.date,{rel:true}).toLowerCase(),date:b.date,go:'fortuna',prio:b.late?3:2}));
  if(n.faturas)upcomingBills(10).filter(b=>b.kind==='inv').forEach(b=>P({id:'inv-'+b.id,type:'faturas',icon:'card',color:'#c084fc',title:b.desc,text:money(b.amount)+' · vencimento '+fdate(b.date,{rel:true}).toLowerCase(),date:b.date,go:'fortuna',prio:2}));
  if(n.eventos)for(let i=0;i<=2;i++){const d=addDays(t,i);eventsOn(d).forEach(e=>P({id:'ev-'+e.id+'-'+d,type:'eventos',icon:'cal',color:EV_CATS[e.cat]||'#8b5cf6',title:(i===0?'Hoje':i===1?'Amanhã':fdate(d,{rel:true}))+': '+e.title,text:(e.time?e.time+(e.end?'–'+e.end:''):'Dia inteiro')+' · '+e.cat,date:d,go:'agenda',prio:i===0?2:1}))}
  if(n.tarefas)overdueTasks().forEach(x=>P({id:'late-'+x.id,type:'tarefas',icon:'alert',color:'#f87171',title:'Tarefa atrasada: '+x.title,text:'Prazo era '+fdate(x.due,{rel:true}).toLowerCase()+' · '+diffDays(x.due,t)+' dia(s) de atraso',date:x.due,go:'tarefas',prio:3}));
  if(n.tarefas)tasksDue(t).forEach(x=>P({id:'due-'+x.id+'-'+t,type:'tarefas',icon:'check',color:'#8b5cf6',title:'Vence hoje: '+x.title,text:'Prioridade '+x.priority,date:t,go:'tarefas',prio:2}));
  if(n.habitos){const pend=S.habits.filter(h=>!h.log[t]);if(pend.length)P({id:'hab-'+t,type:'habitos',icon:'flame',color:'#fb923c',title:pend.length+' hábito(s) pendente(s) hoje',text:pend.slice(0,3).map(h=>h.icon+' '+h.name).join(' · '),date:t,go:'habitos',prio:1})}
  if(n.objetivos)S.goals.filter(g=>!g.done&&g.deadline&&diffDays(t,g.deadline)<=30&&diffDays(t,g.deadline)>=0).forEach(g=>P({id:'goal-'+g.id,type:'objetivos',icon:'target',color:'#34d399',title:'Prazo próximo: '+g.title,text:goalProgress(g)+'% concluído · faltam '+diffDays(t,g.deadline)+' dias',date:g.deadline,go:'objetivos',prio:1}));
  if(n.projetos)S.projects.filter(p=>p.status==='ativo').forEach(p=>{(p.updates||[]).filter(u=>Date.now()-u.at<864e5*7).slice(0,1).forEach(u=>P({id:'proj-'+p.id+'-'+u.at,type:'projetos',icon:'folder',color:p.color,title:'Atualização em '+p.name,text:u.text,date:iso(new Date(u.at)),go:'projetos',prio:0}))});
  S.fgoals.forEach(g=>{if(g.saved>=g.target)P({id:'fg-'+g.id,type:'objetivos',icon:'trophy',color:'#fbbf24',title:'Meta financeira atingida: '+g.name,text:'Parabéns! '+money(g.target)+' acumulados.',date:t,go:'fortuna',prio:1})});
  return out.filter(x=>!S.notifDismissed[x.id]).sort((a,b)=>b.prio-a.prio||a.date.localeCompare(b.date))}

/* ---------- gráficos SVG ---------- */
function tipAttr(t){return `data-tip="${esc(t)}"`}
function barChart(groups,{h=220,series=[{k:'a',c:'var(--green)',n:'Receitas'},{k:'b',c:'var(--pink)',n:'Despesas'}],fmt=money}={}){
  const W=640,H=h,pl=64,pb=26,pt=10;const max=Math.max(1,...groups.flatMap(g=>series.map(s=>g[s.k]||0)))*1.12;
  const step=(W-pl-10)/groups.length,bw=Math.min(22,step/(series.length+1.2));let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for(let i=0;i<=4;i++){const y=pt+(H-pb-pt)*i/4;o+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--dim)">${fmt(max*(1-i/4),true)}</text>`}
  groups.forEach((g,i)=>{const cx=pl+step*i+step/2;series.forEach((s,j)=>{const v=g[s.k]||0;const bh=(H-pb-pt)*v/max;const x=cx-(series.length*bw+(series.length-1)*4)/2+j*(bw+4);
    o+=`<rect class="chart-bar" style="animation-delay:${i*.05}s" x="${x}" y="${H-pb-bh}" width="${bw}" height="${Math.max(0,bh)}" rx="5" fill="${s.c}" ${tipAttr(g.label+' · '+s.n+': '+fmt(v))}/>`});
    o+=`<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(g.label)}</text>`});
  return o+'</svg>'}
function donut(items,{size=170,th=22,center='',sub=''}={}){const tot=sum(items,x=>x.value)||1;const r=(size-th)/2,c=2*Math.PI*r;let off=0;
  let o=`<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--panel3)" stroke-width="${th}"/>`;
  items.forEach((it,i)=>{const len=c*it.value/tot;o+=`<circle class="draw" style="--len:${len};animation-delay:${i*.06}s" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${th}" stroke-dasharray="${Math.max(0,len-2)} ${c}" stroke-dashoffset="${-off}" ${tipAttr(it.label+': '+(it.fmt||money)(it.value)+' ('+Math.round(it.value/tot*100)+'%)')}/>`;off+=len});
  return o+`</svg><span style="text-align:center;line-height:1.15"><div style="font-size:${size>150?19:15}px">${center}</div><div class="tiny dim" style="font-family:var(--font);font-weight:500">${sub}</div></span></div>`}
function lineChart(pts,{h=200,color='var(--acc)',fill=true,fmt=money}={}){const W=640,H=h,pl=66,pb=26,pt=12;if(!pts.length)return '';
  const vals=pts.map(p=>p.v);let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const X=i=>pl+(W-pl-14)*(pts.length===1?.5:i/(pts.length-1)),Y=v=>pt+(H-pb-pt)*(1-(v-mn)/(mx-mn));
  let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)});const gid='g'+uid();
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  for(let i=0;i<=3;i++){const y=pt+(H-pb-pt)*i/3;o+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--dim)">${fmt(mx-(mx-mn)*i/3,true)}</text>`}
  if(fill)o+=`<path d="${d}L${X(pts.length-1)} ${H-pb}L${X(0)} ${H-pb}Z" fill="url(#${gid})"/>`;
  o+=`<path class="draw" style="--len:2000" stroke-dasharray="2000" d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{o+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="var(--bg2)" stroke="${color}" stroke-width="2" ${tipAttr(p.label+': '+fmt(p.v))}/><text x="${X(i)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.label)}</text>`});
  return o+'</svg>'}
function ring(pct,{size=56,th=6,color='var(--acc)'}={}){const r=(size-th)/2,c=2*Math.PI*r;return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--panel3)" stroke-width="${th}"/><circle class="draw" style="--len:${c}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}"/></svg><span style="font-size:${size/4.4}px">${pct}%</span></div>`}
function spark(vals,color='var(--acc2)',w=110,h=34){if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals)||1;const X=i=>i/(vals.length-1)*w,Y=v=>h-3-(v-mn)/((mx-mn)||1)*(h-6);return `<svg width="${w}" height="${h}"><path d="${vals.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join('')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`}

   <div class="card span4"><div class="card-h"><div class="ico">${ic('pie',16)}</div><h3>Gastos por categoria</h3></div><div class="row" style="justify-content:center;margin:6px 0 14px">${donut(cats.map(([c,v])=>({label:c,value:v,color:catMeta(c)[1]})),{center:hv(money(exp,true)),sub:'no mês'})}</div>

function fContas(){return `<div class="row" style="margin-bottom:16px"><div class="muted">Saldo consolidado: <b class="mono" style="color:var(--text)">${hv(money(totalBalance()))}</b></div><span class="spacer"></span><button class="btn" data-act="transfer">${ic('swap',15)} Transferir</button><button class="btn pri" data-act="editAccount">${ic('plus',15)} Nova conta</button></div>
  <div class="grid g4 stagger" style="margin-bottom:18px">${S.accounts.map(a=>{const b=accBalance(a.id);const hist=Array.from({length:6},(_,i)=>{const k=ymAdd(ym(today()),i-5);return sum(S.tx.filter(x=>x.paid&&ym(x.date)<=k),x=>x.type==='income'&&x.accountId===a.id?x.amount:(x.type==='expense'||x.type==='cardpay')&&x.accountId===a.id?-x.amount:x.type==='transfer'?(x.toAccountId===a.id?x.amount:x.accountId===a.id?-x.amount:0):0)+a.initial});

function fRel(){const k=U.repMonth||ym(today());const mode=U.repMode;const t=today();

  const prev=mode==='ano'?Array.from({length:12},(_,i)=>(+k.slice(0,4)-1)+'-'+String(i+1).padStart(2,'0')):[ymAdd(k,-1)];const pcats=Object.fromEntries(byCat(prev.flatMap(m=>expensesIn(m))));
  const allM=[...new Set(S.tx.map(x=>ym(x.date)))].filter(m=>m<=ym(t)).sort().reverse();

  <div class="grid g-dash"><div class="card span6"><div class="card-h"><div class="ico">${ic('pie',16)}</div><h3>Categorias com maiores gastos</h3><span class="more small dim">vs. período anterior</span></div>${cats.map(([c,v])=>{const pv=pcats[c]||0;const d=pv?Math.round((v-pv)/pv*100):null;return `<div style="margin:10px 0"><div class="row small" style="margin-bottom:5px"><span>${catMeta(c)[0]} ${c}</span><span class="spacer"></span><b class="mono">${hv(money(v))}</b><span class="tiny ${d>0?'red':'green'}" style="width:52px;text-align:right">${d==null?'novo':(d>0?'▲':'▼')+Math.abs(d)+'%'}</span></div><div class="bar thin"><i style="width:${v/cats[0][1]*100}%;background:${catMeta(c)[1]}"></i></div></div>`}).join('')||empty('Sem dados no período')}</div>

  const selEv=eventsOn(sel),selT=S.tasks.filter(t=>t.due===sel);const up=[];for(let i=0;i<14&&up.length<6;i++){const x=addDays(today(),i);eventsOn(x).forEach(e=>{if(up.length<6&&!(i===0&&e.end&&toMin(e.end)<new Date().getHours()*60))up.push({e,x})})}
  const cf=conflicts();

  <div class="grid g-dash"><div class="span9">${body}</div>

const PRI_ORD={alta:0,media:1,baixa:2};
function taskSort(a,b){const t=today();const la=a.due&&a.due<t,lb=b.due&&b.due<t;if(la!==lb)return la?-1:1;return (a.due||'9999').localeCompare(b.due||'9999')||PRI_ORD[a.priority]-PRI_ORD[b.priority]}
function taskMeta(x){const t=today();const p=S.projects.find(p=>p.id===x.projectId);const late=x.status!=='done'&&x.due&&x.due<t;
  return `<span class="pill ${x.priority}">${x.priority==='media'?'média':x.priority}</span>${x.due?`<span class="pill ${late?'late':''}">${ic('clock',11)} ${late?'Atrasada · ':''}${fdate(x.due,{rel:true})}</span>`:''}<span class="pill">${esc(x.cat)}</span>${p?`<span class="pill" style="border-color:${p.color}55;color:${p.color}">${ic('folder',11)} ${esc(p.name)}</span>`:''}${x.recur!=='none'?`<span class="pill">${ic('repeat',11)}</span>`:''}${x.eventId&&S.events.find(e=>e.id===x.eventId)?`<span class="pill">${ic('cal',11)} ${esc(S.events.find(e=>e.id===x.eventId).title)}</span>`:''}`}
function filteredTasks(){const f=U.taskFilter;return S.tasks.filter(x=>(f.cat==='all'||x.cat===f.cat)&&(f.prio==='all'||x.priority===f.prio)&&(f.proj==='all'||x.projectId===f.proj)).sort(taskSort)}
function vTarefas(){const f=U.taskFilter,all=filteredTasks();const t=today();
  const late=all.filter(x=>x.status!=='done'&&x.due&&x.due<t),tod=all.filter(x=>x.status!=='done'&&x.due===t);
  let body;if(U.taskView==='kanban')body=kanbanHTML(all);else{
    const show=all.filter(x=>f.status==='todas'||(f.status==='abertas'?x.status!=='done':f.status==='concluidas'?x.status==='done':x.status===f.status));
    const groups=[['Atrasadas',show.filter(x=>x.status!=='done'&&x.due&&x.due<t),'red'],['Hoje',show.filter(x=>x.status!=='done'&&x.due===t),''],['Próximos 7 dias',show.filter(x=>x.status!=='done'&&x.due>t&&x.due<=addDays(t,7)),''],['Mais tarde / sem prazo',show.filter(x=>x.status!=='done'&&(!x.due||x.due>addDays(t,7))),''],['Concluídas',show.filter(x=>x.status==='done'),'']];
    body=groups.filter(g=>g[1].length).map(g=>`<div style="margin-bottom:18px"><div class="row small" style="margin-bottom:8px;font-weight:600;letter-spacing:.04em"><span class="${g[2]}">${g[0]}</span><span class="dim">${g[1].length}</span></div>${g[1].map(taskRow).join('')}</div>`).join('')||`<div class="card">${empty('Nenhuma tarefa neste filtro','check')}</div>`}
  return `<div class="page-head"><div><div class="eyebrow">Organização e produtividade</div><h2>Tarefas</h2><p>${S.tasks.filter(x=>x.status!=='done').length} abertas · ${late.length} atrasadas · ${tod.length} para hoje · ${S.tasks.filter(x=>x.status==='done').length} concluídas</p></div><div class="actions"><div class="seg"><button class="${U.taskView==='lista'?'on':''}" data-act="taskView" data-v="lista">${ic('list',14)} Lista</button><button class="${U.taskView==='kanban'?'on':''}" data-act="taskView" data-v="kanban">${ic('kanban',14)} Kanban</button></div><button class="btn pri" data-act="newTask">${ic('plus',16)} Nova tarefa</button></div></div>
  ${late.length?`<div class="card" style="margin-bottom:16px;border-color:rgba(248,113,113,.3);background:linear-gradient(90deg,rgba(248,113,113,.08),var(--panel))"><div class="row wrap">${ic('alert',18)}<b>${late.length} tarefa(s) atrasada(s) precisam de atenção.</b><span class="muted small">Mais antiga: ${esc(late[0].title)} (${diffDays(late[0].due,t)} dias)</span><span class="spacer"></span><button class="btn sm" data-act="aiAsk" data-q="Quais são minhas tarefas atrasadas?">${ic('ai',14)} Pedir ajuda à IA</button></div></div>`:''}
  <form class="row" style="margin-bottom:14px" data-form="quickTask"><input class="inp" name="t" placeholder="+ Adicionar tarefa rápida (Enter) — ex.: Ler artigo amanhã" autocomplete="off"><button class="btn">Adicionar</button></form>
  <div class="row wrap" style="margin-bottom:18px">${U.taskView==='lista'?`<div class="chip-row">${[['abertas','Abertas'],['todo','Pendentes'],['doing','Em andamento'],['concluidas','Concluídas'],['todas','Todas']].map(([v,l])=>`<button class="chip ${f.status===v?'on':''}" data-act="taskF" data-k="status" data-v="${v}">${l}</button>`).join('')}</div>`:''}<span class="spacer"></span>
   <select class="inp" style="width:auto" data-change="taskF" data-k="cat"><option value="all">Todas categorias</option>${opt(S.taskCats,f.cat)}</select>
   <select class="inp" style="width:auto" data-change="taskF" data-k="prio"><option value="all">Toda prioridade</option>${opt([['alta','Alta'],['media','Média'],['baixa','Baixa']],f.prio)}</select>
   <select class="inp" style="width:auto" data-change="taskF" data-k="proj"><option value="all">Todos projetos</option>${opt(S.projects.map(p=>[p.id,p.name]),f.proj)}</select></div>${body}`}
function taskRow(x){const late=x.status!=='done'&&x.due&&x.due<today();return `<div class="task-row ${late?'late':''}"><div class="check ${x.status==='done'?'on':''}" data-act="toggleTask" data-id="${x.id}"></div><div class="body" data-act="editTask" data-id="${x.id}"><div class="t ${x.status==='done'?'done-t':''}">${esc(x.title)} ${x.status==='doing'?'<span class="pill accp" style="margin-left:4px">em andamento</span>':''}</div>${x.desc?`<div class="small dim" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.desc)}</div>`:''}<div class="meta">${taskMeta(x)}</div></div>${x.status==='todo'?`<button class="btn ghost xs" data-act="taskStatus" data-id="${x.id}" data-v="doing" title="Iniciar">▶ Iniciar</button>`:''}</div>`}
function kanbanHTML(list,cols=[['todo','Pendente','var(--dim)'],['doing','Em andamento','var(--acc)'],['done','Concluída','var(--green)']]){
  return `<div class="kanban">${cols.map(([st,l,c])=>{const items=list.filter(x=>x.status===st);return `<div class="kcol" data-drop="${st}"><div class="kcol-h"><i class="cdot" style="background:${c}"></i>${l}<span class="count">${items.length}</span></div>${items.map(x=>`<div class="kcard" draggable="true" data-drag="${x.id}" data-act="editTask" data-id="${x.id}"><div class="t ${st==='done'?'done-t':''}">${esc(x.title)}</div><div class="meta">${taskMeta(x)}</div></div>`).join('')}<button class="btn ghost sm full" data-act="newTask" data-status="${st}">${ic('plus',14)} Adicionar</button></div>`}).join('')}</div>`}
function bindKanban(){$$('[data-drag]').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.drag);el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'))});
  $$('[data-drop]').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',()=>col.classList.remove('over'));col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');setTaskStatus(id,col.dataset.drop)})})}
function setTaskStatus(id,st){const x=S.tasks.find(t=>t.id===id);if(!x||x.status===st)return;const was=x.status;x.status=st;
  if(st==='done'){x.doneAt=today();if(x.recur&&x.recur!=='none'&&was!=='done'){const nd=x.recur==='daily'?addDays(x.due||today(),1):x.recur==='weekly'?addDays(x.due||today(),7):addMonths(x.due||today(),1);S.tasks.push(Object.assign({},x,{id:uid(),status:'todo',due:nd,doneAt:null,created:today()}));toast('Concluída! Próxima ocorrência criada para '+fdate(nd))}else toast('Tarefa concluída 🎉')}
  else x.doneAt=null;save();render()}
function parseQuickDate(s){const n=norm(s);const t=today();let due='',title=s;
  const rules=[[/\bdepois de amanha\b/,()=>addDays(t,2)],[/\bamanha\b/,()=>addDays(t,1)],[/\bhoje\b/,()=>t],[/\bsemana que vem\b|\bproxima semana\b/,()=>addDays(t,7)]];
  for(const [r,f] of rules){if(r.test(n)){due=f();title=title.replace(new RegExp(r.source.replace(/\\b/g,'').replace('amanha','amanh[aã]').replace('proxima','pr[oó]xima'),'i'),'');break}}
  if(!due){const ds=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];ds.forEach((w,i)=>{if(!due&&new RegExp('\\b'+w).test(n)){let k=(i-D(t).getDay()+7)%7||7;due=addDays(t,k);title=title.replace(new RegExp('(na |no |n[ao] )?'+w.replace('terca','ter[cç]a').replace('sabado','s[aá]bado')+'(-feira)?','i'),'')}})}
  const m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(!due&&m){const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):new Date().getFullYear();due=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;title=title.replace(m[0],'')}
  title=title.replace(/\s+(para|até|ate|no|na|de)\s*$/i,'').replace(/\s{2,}/g,' ').trim();return {due,title}}
function openTask(x,preset={}){const isNew=!x;x=x||Object.assign({title:'',desc:'',due:today(),priority:'media',cat:'Pessoal',status:'todo',projectId:'',goalId:'',eventId:'',recur:'none'},preset);
  openModal(isNew?'Nova tarefa':'Editar tarefa',`${fld('Título',inp('title',x.title,'text','required placeholder="O que precisa ser feito?"'))}${fld('Descrição','<textarea name="desc" placeholder="Detalhes da atividade…">'+esc(x.desc)+'</textarea>')}
   <div class="frow3">${fld('Prazo',inp('due',x.due,'date'))}${fld('Prioridade',`<select name="priority">${opt([['alta','Alta'],['media','Média'],['baixa','Baixa']],x.priority)}</select>`)}${fld('Status',`<select name="status">${opt([['todo','Pendente'],['doing','Em andamento'],['done','Concluída']],x.status)}</select>`)}</div>
   <div class="frow3">${fld('Categoria',`<select name="cat">${opt(S.taskCats,x.cat)}</select>`)}${fld('Repetição',`<select name="recur">${opt([['none','Não repete'],['daily','Diária'],['weekly','Semanal'],['monthly','Mensal']],x.recur)}</select>`)}${fld('Projeto',`<select name="projectId"><option value="">Nenhum</option>${opt(S.projects.filter(p=>p.status!=='concluido'||p.id===x.projectId).map(p=>[p.id,p.name]),x.projectId)}</select>`)}</div>
   <div class="frow">${fld('Objetivo relacionado',`<select name="goalId"><option value="">Nenhum</option>${opt(S.goals.filter(g=>!g.done).map(g=>[g.id,g.title]),x.goalId)}</select>`)}${fld('Compromisso relacionado',`<select name="eventId"><option value="">Nenhum</option>${opt(S.events.filter(e=>e.date>=addDays(today(),-30)||e.recur!=='none').map(e=>[e.id,e.title+' · '+fdate(e.date)]),x.eventId)}</select>`)}</div>`,
   {onSave:fd=>{const o={title:fd.title.trim(),desc:fd.desc,due:fd.due,priority:fd.priority,cat:fd.cat,recur:fd.recur,projectId:fd.projectId,goalId:fd.goalId,eventId:fd.eventId};
     if(isNew){S.tasks.push(Object.assign({id:uid(),status:fd.status,created:today(),doneAt:fd.status==='done'?today():null},o));toast('Tarefa criada')}else{Object.assign(x,o);if(x.status!==fd.status){setTimeout(()=>setTaskStatus(x.id,fd.status))}toast('Tarefa atualizada')}},
    danger:isNew?null:{fn:()=>{S.tasks=S.tasks.filter(t=>t.id!==x.id);toast('Tarefa excluída','trash')}}})}

/* ---------- OBJETIVOS ---------- */
const HORIZ={curto:'Curto prazo',medio:'Médio prazo',longo:'Longo prazo'};
function vObjetivos(){const act=S.goals.filter(g=>!g.done),done=S.goals.filter(g=>g.done);const avg=act.length?Math.round(sum(act,goalProgress)/act.length):0;
  const list=U.goalTab==='ativos'?act:done;
  return `<div class="page-head"><div><div class="eyebrow">Metas e conquistas</div><h2>Objetivos</h2><p>Resultados que você deseja alcançar — divididos em etapas e conectados a tarefas e hábitos.</p></div><div class="actions"><button class="btn pri" data-act="editGoal">${ic('plus',16)} Novo objetivo</button></div></div>
  <div class="grid g4 stagger" style="margin-bottom:18px"><div class="card stat glow"><div class="lbl">${ic('target',15)} Em andamento</div><div class="val">${act.length}</div></div><div class="card stat"><div class="lbl">${ic('chart',15)} Progresso médio</div><div class="val">${avg}%</div>${bar(avg)}</div><div class="card stat"><div class="lbl">${ic('trophy',15)} Conquistados</div><div class="val">${done.length}</div></div><div class="card stat"><div class="lbl">${ic('clock',15)} Próximo prazo</div><div class="val" style="font-size:18px">${act.length?esc([...act].sort((a,b)=>a.deadline.localeCompare(b.deadline))[0].title):'—'}</div><div class="delta muted">${act.length?fdate([...act].sort((a,b)=>a.deadline.localeCompare(b.deadline))[0].deadline,{y:1}):''}</div></div></div>
  <div class="tabs" style="display:inline-flex"><button class="${U.goalTab==='ativos'?'on':''}" data-act="goalTab" data-v="ativos">Em andamento (${act.length})</button><button class="${U.goalTab==='concluidos'?'on':''}" data-act="goalTab" data-v="concluidos">${ic('trophy',14)} Conquistas (${done.length})</button></div>
  ${U.goalTab==='concluidos'?(done.map(g=>`<div class="trophy"><div style="font-size:26px">🏆</div><div><div style="font-weight:600">${esc(g.title)}</div><div class="small muted">${g.cat} · concluído em ${fdate(g.doneAt||g.deadline,{y:1})}</div></div><span class="spacer"></span><button class="btn ghost xs" data-act="reopenGoal" data-id="${g.id}">Reabrir</button></div>`).join('')||`<div class="card">${empty('Suas conquistas aparecerão aqui','trophy')}</div>`):
  `<div class="grid g2 stagger">${list.map(goalCard).join('')||`<div class="card">${empty('Crie seu primeiro objetivo','target')}</div>`}</div>`}`}
function goalCard(g){const p=goalProgress(g);const tasks=S.tasks.filter(t=>t.goalId===g.id),habs=S.habits.filter(h=>h.goalId===g.id);const dl=diffDays(today(),g.deadline);
  return `<div class="card goal-card"><div class="top">${ring(p,{size:64,th:6})}<div style="flex:1;min-width:0"><div class="row"><span class="pill accp">${esc(g.cat)}</span><span class="pill">${HORIZ[g.horizon]||''}</span></div><h3 style="font-size:17px;margin-top:8px">${esc(g.title)}</h3><div class="small ${dl<0?'red':'dim'}">${dl<0?'Prazo vencido há '+(-dl)+' dias':'Faltam '+dl+' dias'} · ${fdate(g.deadline,{y:1})}</div></div><button class="btn ghost xs" data-act="editGoal" data-id="${g.id}">${ic('edit',13)}</button></div>
   ${g.desc?`<p class="small muted" style="margin-top:10px">${esc(g.desc)}</p>`:''}
   ${g.metric&&+g.metric.target?`<div style="margin-top:14px"><div class="row small" style="margin-bottom:6px"><span class="muted">Meta mensurável</span><span class="spacer"></span><b class="mono">${g.metric.current} / ${g.metric.target} ${esc(g.metric.unit)}</b></div>${bar(p)}<div class="row" style="margin-top:8px;gap:6px"><button class="btn xs" data-act="goalMetric" data-id="${g.id}" data-d="-1">−1</button><button class="btn xs" data-act="goalMetric" data-id="${g.id}" data-d="1">+1</button><button class="btn xs" data-act="goalMetricSet" data-id="${g.id}">Atualizar valor</button></div></div>`:''}
   ${g.steps.length?`<div class="steps" style="margin-top:14px"><div class="tiny dim" style="letter-spacing:.08em;font-weight:600">ETAPAS · ${g.steps.filter(s=>s.done).length}/${g.steps.length}</div>${g.steps.map(s=>`<div class="st"><div class="check ${s.done?'on':''}" data-act="goalStep" data-id="${g.id}" data-s="${s.id}"></div><span class="${s.done?'done-t':''}">${esc(s.t)}</span></div>`).join('')}</div>`:''}
   <form class="row" style="margin-top:8px" data-form="addStep" data-id="${g.id}"><input class="inp" name="s" placeholder="+ Adicionar etapa" style="padding:7px 10px;font-size:12.5px"></form>
   ${tasks.length||habs.length?`<div class="row wrap" style="margin-top:14px;gap:6px">${tasks.length?`<span class="pill">${ic('check',11)} ${tasks.filter(t=>t.status==='done').length}/${tasks.length} tarefas</span>`:''}${habs.map(h=>`<span class="pill">${h.icon} ${esc(h.name)} · 🔥${streak(h)}</span>`).join('')}</div>`:''}
   <div class="row" style="margin-top:14px"><button class="btn sm" data-act="newTask" data-goal="${g.id}">${ic('plus',13)} Tarefa</button><button class="btn sm" data-act="aiAsk" data-q="Divida o objetivo ${esc(g.title)} em etapas">${ic('ai',13)} Sugerir etapas</button><span class="spacer"></span><button class="btn sm pri" data-act="completeGoal" data-id="${g.id}">${ic('trophy',13)} Concluir</button></div></div>`}
function openGoal(g){const isNew=!g;g=g||{title:'',cat:'Pessoal',horizon:'medio',deadline:addMonths(today(),3),desc:'',metric:{unit:'',current:0,target:0},steps:[],done:false};
  openModal(isNew?'Novo objetivo':'Editar objetivo',`${fld('Objetivo',inp('title',g.title,'text','required placeholder="Ex.: Aprender programação em 6 meses"'))}${fld('Descrição','<textarea name="desc" placeholder="Por que esse objetivo importa?">'+esc(g.desc)+'</textarea>')}
   <div class="frow3">${fld('Categoria',`<select name="cat">${opt(S.goalCats,g.cat)}</select>`)}${fld('Horizonte',`<select name="horizon">${opt(Object.entries(HORIZ),g.horizon)}</select>`)}${fld('Prazo',inp('deadline',g.deadline,'date','required'))}</div>
   <div class="frow3">${fld('Valor atual',inp('mc',g.metric.current,'number','step="any"'))}${fld('Meta (mensurável)',inp('mt',g.metric.target||'','number','step="any" placeholder="opcional"'))}${fld('Unidade',inp('mu',g.metric.unit,'text','placeholder="livros, km, %…"'))}</div>
   ${isNew?fld('Etapas (uma por linha)','<textarea name="steps" placeholder="Etapa 1&#10;Etapa 2"></textarea>'):''}`,
   {onSave:fd=>{const o={title:fd.title.trim(),desc:fd.desc,cat:fd.cat,horizon:fd.horizon,deadline:fd.deadline,metric:{current:+fd.mc||0,target:+fd.mt||0,unit:fd.mu}};
     if(isNew){S.goals.push(Object.assign({id:uid(),done:false,steps:(fd.steps||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(),t,done:false}))},o));toast('Objetivo criado')}else{Object.assign(g,o);toast('Objetivo atualizado')}},
    danger:isNew?null:{fn:()=>{S.goals=S.goals.filter(x=>x.id!==g.id);toast('Objetivo excluído','trash')}}})}

/* ---------- HÁBITOS ---------- */
function vHabitos(){const t=today();const doneT=S.habits.filter(h=>h.log[t]).length;const avg=S.habits.length?Math.round(sum(S.habits,h=>consistency(h))/S.habits.length):0;const best=[...S.habits].sort((a,b)=>consistency(b)-consistency(a));
  const last7=Array.from({length:7},(_,i)=>addDays(t,i-6));
  return `<div class="page-head"><div><div class="eyebrow">Desenvolvimento pessoal</div><h2>Hábitos</h2><p>Transforme sua rotina em algo mensurável e visual.</p></div><div class="actions"><button class="btn pri" data-act="editHabit">${ic('plus',16)} Novo hábito</button></div></div>
  <div class="grid g4 stagger" style="margin-bottom:18px"><div class="card stat glow"><div class="lbl">${ic('check',15)} Hoje</div><div class="val">${doneT}/${S.habits.length}</div>${bar(S.habits.length?doneT/S.habits.length*100:0)}</div><div class="card stat"><div class="lbl">${ic('chart',15)} Consistência (30 dias)</div><div class="val">${avg}%</div></div><div class="card stat"><div class="lbl">${ic('flame',15)} Maior sequência atual</div><div class="val">${Math.max(0,...S.habits.map(streak))} dias</div><div class="delta muted">${best.length?esc([...S.habits].sort((a,b)=>streak(b)-streak(a))[0].name):''}</div></div><div class="card stat"><div class="lbl">${ic('trophy',15)} Mais consistente</div><div class="val" style="font-size:18px">${best.length?best[0].icon+' '+esc(best[0].name):'—'}</div><div class="delta muted">${best.length?consistency(best[0])+'% no mês':''}</div></div></div>
  <div class="grid g-dash"><div class="col span8" style="gap:12px">${S.habits.map(h=>{const st=streak(h);return `<div class="card hab-card" style="--hc:${h.color}"><div class="habit-dot ${h.log[t]?'on':''}" style="width:52px;height:52px;font-size:24px;${h.log[t]?`border-color:${h.color};background:${h.color}22`:''}" data-act="toggleHabit" data-id="${h.id}" data-date="${t}">${h.icon}</div>
   <div style="min-width:0"><div class="row"><b style="font-size:15px">${esc(h.name)}</b><span class="pill">${h.freq==='daily'?'Diário':h.target+'x por semana'}</span>${h.reminder?`<span class="pill">${ic('bell',11)} ${h.reminder}</span>`:''}<button class="btn ghost xs" data-act="editHabit" data-id="${h.id}">${ic('edit',13)}</button></div>
    <div class="week7" style="margin-top:10px">${last7.map(d=>`<div class="d ${h.log[d]?'on':''} ${d===t?'today':''}" data-act="toggleHabit" data-id="${h.id}" data-date="${d}" title="${fdate(d)}">${DSEM[D(d).getDay()].slice(0,1)}</div>`).join('')}<div class="small muted" style="margin-left:10px;align-self:center">${h.freq==='weekly'?`${weekCount(h)}/${h.target} na semana · `:''}${consistency(h)}% em 30 dias</div></div></div>

function md(src){let s=esc(src);const blocks=[];s=s.replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push(c);return `\u0000${blocks.length-1}\u0000`});
  s=s.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{const n=S.notes.find(x=>norm(x.title)===norm(t));return `<span class="wl ${n?'':'missing'}" data-act="${n?'openNote':'createNoteFrom'}" data-id="${n?n.id:''}" data-t="${esc(t)}">${t}</span>`});
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const lines=s.split('\n');let out='',inList=false;
  lines.forEach(l=>{let m;if(/^\s*[-*] /.test(l)){if(!inList){out+='<ul>';inList=true}out+='<li>'+l.replace(/^\s*[-*] /,'')+'</li>';return}if(inList){out+='</ul>';inList=false}
    if(m=l.match(/^(#{1,3}) (.*)/))out+=`<h${m[1].length}>${m[2]}</h${m[1].length}>`;else if(m=l.match(/^&gt; (.*)/))out+=`<blockquote>${m[1]}</blockquote>`;else if(l.trim())out+=`<p>${l}</p>`});
  if(inList)out+='</ul>';
  out=out.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<pre><code>${blocks[i]}</code></pre>`)}
